[package]
name = "corridorkey-desktop"
version = "1.0.0-dev.1"
description = "Free desktop app for CorridorKey 2.0"
authors = ["MarcelineVPQ"]
edition = "2021"
license = "SEE LICENSE IN LICENSE"

[lib]
name = "corridorkey_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
