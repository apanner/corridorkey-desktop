name: Windows

# Tauri 2 shell for Windows (WebView2). The installer does not contain Node,
# Electron, or node_modules. The engine is not in this build (update_plan.md
# phase 0; the engine follows in phase 2).
on:
  workflow_dispatch:
  push:
    branches: [tauri]

permissions:
  contents: read

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the UI toolchain
        run: npx -y npm@10.9.2 ci
      - name: Build the installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: corridorkey-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
